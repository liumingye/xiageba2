services:
  db:
    image: groonga/pgroonga:4.0.6-alpine-18
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --dir
      - /data
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5736:3000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
