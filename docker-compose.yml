services:
  db:
    image: groonga/pgroonga:4.0.6-alpine-18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -p
        - "5432"
        - -q
        - -U
        - user_5TetdD
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5736:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
